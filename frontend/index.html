<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotChords Workstation</title>
    <meta name="description" content="HotChords — Interactive piano music stand. Follow along with simplified or original chords, hand diagrams, and persistent piano.">
    <link rel="stylesheet" href="/css/piano.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="app-shell">

<!-- ╔══════════════════════════════════════════╗
     ║  UPLOAD SCREEN                           ║
     ╚══════════════════════════════════════════╝ -->
<div id="upload-screen" class="screen active">
    <div class="modal-box" onclick="document.getElementById('file-input').click()">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:20px; opacity:0.9">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <h2 style="font-size:22px; font-weight:700; margin-bottom:6px; letter-spacing:-0.5px;">Start your session</h2>
        <p style="color:var(--text-muted); font-size:15px; font-weight:500;">Drop an audio file or click to browse</p>
        <input type="file" id="file-input" class="hidden" accept=".mp3,.wav,.flac">
    </div>
</div>

<!-- ╔══════════════════════════════════════════╗
     ║  ANALYSIS SCREEN                         ║
     ╚══════════════════════════════════════════╝ -->
<div id="analysis-screen" class="screen">
    <div class="modal-box" style="cursor:default; max-width:440px;">
        <h3 id="prog-file-name" style="font-size:18px; font-weight:700; margin-bottom:16px; letter-spacing:-0.4px;">Analyzing audio...</h3>
        <div id="prog-bar-container" class="prog-bar-wrap">
            <div id="prog-bar" class="prog-bar-fill" style="width: 5%;"></div>
        </div>
        <div id="prog-msg" style="font-size:12px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-top:8px;">Uploading audio file...</div>
        <div id="prog-error-box" class="hidden" style="margin-top:16px; padding:12px 14px; background:rgba(229, 72, 77, 0.12); border:1px solid #E5484D; border-radius:8px; text-align:left;">
            <div style="color:#E5484D; font-weight:700; font-size:13px; margin-bottom:4px;">Analysis Error</div>
            <div id="prog-error-detail" style="color:var(--text); font-size:12px; word-break:break-word;"></div>
            <button onclick="resetApp()" style="margin-top:10px; padding:6px 14px; background:var(--blue); color:white; border:none; border-radius:6px; font-weight:600; font-size:12px; cursor:pointer;">Choose Another File</button>
        </div>
    </div>
</div>

<!-- ╔══════════════════════════════════════════════════════════════╗
     ║  PERMANENT SINGLE WORKSPACE (Interactive Music Stand)        ║
     ║  Hierarchy:                                                  ║
     ║  1. HEADER (Logo + Metadata + Mode Selector + Controls)     ║
     ║  2. CENTRAL CHORD LEARNING (Left Hand | 3 Chords | Right)    ║
     ║  3. PERSISTENT PIANO                                         ║
     ║  4. PLAYBACK (Waveform + Transport Controls)                 ║
     ╚══════════════════════════════════════════════════════════════╝ -->
<div id="workspace" class="workspace hidden" data-mode="simplified">

    <!-- 1. HEADER ROW -->
    <header class="ws-header">
        <div class="ws-logo" onclick="resetApp()" title="New Song">Hot<span>Chords</span> <span class="ws-version">v0.2</span></div>

        <div class="ws-meta">
            <div class="ws-meta-item"><span class="ws-meta-label">Key</span><span class="ws-meta-val" id="val-key">—</span></div>
            <div class="ws-meta-item"><span class="ws-meta-label">BPM</span><span class="ws-meta-val" id="val-bpm">—</span></div>
            <div class="ws-meta-item"><span class="ws-meta-label">Time</span><span class="ws-meta-val" id="val-sig">—</span></div>
            <div class="ws-meta-item ws-meta-track"><span class="ws-meta-label">Track</span><span class="ws-meta-val" id="res-file-name">—</span></div>
        </div>

        <!-- Mode Selector: Simplified vs Original -->
        <div class="ws-mode-selector" role="tablist" aria-label="Chord mode">
            <button class="mode-btn active" data-mode="simplified" id="mode-btn-simplified" onclick="setMode('simplified')" role="tab" aria-selected="true">Simplified</button>
            <button class="mode-btn"        data-mode="original"   id="mode-btn-original"   onclick="setMode('original')"   role="tab" aria-selected="false">Original</button>
        </div>

        <div class="ws-quick-controls">
            <div class="speed-group">
                <button class="speed-btn active" id="spd-100" onclick="setSpeed(1.0)">1.00×</button>
                <button class="speed-btn"         id="spd-075" onclick="setSpeed(0.75)">0.75×</button>
                <button class="speed-btn"         id="spd-050" onclick="setSpeed(0.50)">0.50×</button>
            </div>
            <button class="ctrl-btn" id="btn-sustain"   onclick="handleToggleSustain()" title="Toggle piano sustain pedal">Sustain OFF</button>
            <button class="ctrl-btn"                     onclick="handleRestart()">↺ Restart</button>
            <button class="ctrl-btn danger"              onclick="handleStop()">■ Stop</button>
            <button class="ctrl-btn" id="btn-new-song"  onclick="resetApp()">New Song</button>
        </div>
    </header>

    <!-- 2. CENTRAL CHORD LEARNING AREA: Left Hand | 3-Chord Reel | Right Hand -->
    <main class="ws-learning-area">

        <!-- Left Hand Column (Bass) -->
        <aside id="ws-hand-left" class="ws-hand-col ws-hand-col--left" aria-label="Left hand bass guidance">
            <div class="ws-hand-label">Left Hand (Bass)</div>
            <div id="ws-lh-svg" class="ws-hand-svg"></div>
            <div id="ws-lh-chips" class="ws-finger-chips"><span class="ws-chip-idle">—</span></div>
        </aside>

        <!-- Center: 3-Chord Reel (Prev < Current Hero > Next) -->
        <section class="ws-chord-center">
            <div id="chord-viewport" class="ws-chord-viewport">
                <div id="chord-track" class="ws-chord-track">

                    <div id="chord-prev" class="chord-card chord-card--prev" title="Click to go back">
                        <div class="chord-card-label">Previous</div>
                        <div class="chord-card-name" data-chord-name>—</div>
                    </div>

                    <div id="chord-current" class="chord-card chord-card--current" aria-live="polite" aria-atomic="true">
                        <div class="chord-card-label">Current Chord</div>
                        <div class="chord-card-name chord-card-name--hero" data-chord-name>—</div>
                        <div class="chord-card-voicing" data-chord-voicing></div>
                        <div class="chord-progress-track" aria-hidden="true">
                            <div class="chord-progress-fill" id="chord-progress-fill"></div>
                        </div>
                    </div>

                    <div id="chord-next" class="chord-card chord-card--next" title="Click to skip ahead">
                        <div class="chord-card-label">Next</div>
                        <div class="chord-card-name" data-chord-name>—</div>
                    </div>

                </div>
            </div>
        </section>

        <!-- Right Hand Column (Harmony) -->
        <aside id="ws-hand-right" class="ws-hand-col ws-hand-col--right" aria-label="Right hand harmony guidance">
            <div class="ws-hand-label">Right Hand (Harmony)</div>
            <div id="ws-rh-svg" class="ws-hand-svg"></div>
            <div id="ws-rh-chips" class="ws-finger-chips"><span class="ws-chip-idle">—</span></div>
        </aside>

    </main>

    <!-- 3. PERSISTENT PIANO -->
    <div class="ws-piano" id="ws-piano">
        <div id="piano-keyboard"></div>
    </div>

    <!-- 4. PLAYBACK BAR / WAVEFORM & TRANSPORT -->
    <footer class="ws-playback">
        <div class="ws-waveform" id="wf-wrap" onclick="handleWfClick(event)" title="Click to seek">
            <canvas id="wf-canvas"></canvas>
            <div id="playhead"></div>
        </div>
        <div class="ws-transport-row">
            <button class="play-btn" id="main-play-btn" onclick="handleTogglePlay()" aria-label="Play / Pause">
                <svg id="play-icon" width="12" height="12" viewBox="0 0 16 16" fill="white"><path d="M5 3l9 5-9 5V3z"/></svg>
            </button>
            <span id="cur-time" class="time-disp">0:00</span>
            <input type="range" id="seek-bar" class="seek-bar" min="0" step="0.05" value="0" oninput="handleSeek(this.value)" aria-label="Seek">
            <span id="dur-time" class="time-disp">0:00</span>
        </div>
    </footer>

</div><!-- #workspace -->

<!-- ══════════════════════════════════════════════
     CORE SCRIPTS
     ══════════════════════════════════════════════ -->
<!-- Theory & Fingering Engines -->
<script src="/js/engine/musicTheoryFormatter.js"></script>
<script src="/js/engine/pianoFingeringEngine.js"></script>
<script src="/js/engine/chordTransitionEngine.js"></script>
<script src="/js/engine/currentChordEngine.js"></script>

<!-- UI Components -->
<script src="/js/ui/handDiagrams.js"></script>
<script src="/js/ui/pianoKeyboard.js"></script>
<script src="/js/ui/workspaceChordTimeline.js"></script>
<script src="/js/ui/workspaceHandController.js"></script>

<!-- Audio & Clock Infrastructure -->
<script src="/js/audio/pianoPlaybackService.js"></script>
<script src="/js/audio/originalChordPlaybackController.js"></script>
<script src="/js/audio/beginnerChordPlaybackController.js"></script>
<script src="/js/audio/unifiedPianoPlaybackController.js"></script>
<script src="/js/audio/playbackClock.js"></script>
<script src="/js/audio/songAudioController.js"></script>

<script>
'use strict';

// ─── App State ────────────────────────────────────────────────────────────────
let DATA = null;
let audioURL = null;
let currentFile = null;
let piano = null;
let currentChordEngine = null;

// Active chord dataset mode: 'simplified' | 'original'
let activeMode = 'simplified';

let analysisPollInterval = null;

// ─── Init ─────────────────────────────────────────────────────────────────────
window.onload = () => {
    piano = new PianoKeyboard('piano-keyboard');
    window.piano = piano;

    PlaybackClock.subscribe(snap => updateClockUI(snap));

    document.addEventListener('keydown', e => {
        if (e.code === 'Space' && DATA) { e.preventDefault(); handleTogglePlay(); }
    });

    document.getElementById('file-input').onchange = e => {
        if (e.target.files[0]) handleFile(e.target.files[0]);
    };

    document.getElementById('upload-screen').addEventListener('dragover', e => e.preventDefault());
    document.getElementById('upload-screen').addEventListener('drop', e => {
        e.preventDefault();
        const file = e.dataTransfer.files[0];
        if (file) handleFile(file);
    });
};

// ─── Screen routing ───────────────────────────────────────────────────────────
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const target = document.getElementById(id);
    if (target) target.classList.add('active');
    const ws = document.getElementById('workspace');
    if (ws) ws.classList.toggle('hidden', id !== 'workspace');
}

// ─── Analysis error ───────────────────────────────────────────────────────────
function showAnalysisError(detail) {
    if (analysisPollInterval) { clearInterval(analysisPollInterval); analysisPollInterval = null; }
    document.getElementById('prog-bar-container')?.classList.add('hidden');
    document.getElementById('prog-msg')?.classList.add('hidden');
    document.getElementById('prog-error-box')?.classList.remove('hidden');
    const det = document.getElementById('prog-error-detail');
    if (det) det.textContent = detail || 'An unexpected error occurred during audio processing.';
}

// ─── Reset / New Song ─────────────────────────────────────────────────────────
function resetApp() {
    if (analysisPollInterval) { clearInterval(analysisPollInterval); analysisPollInterval = null; }

    PlaybackClock.stop();
    SongAudioController.stop();
    UnifiedPianoPlaybackController.stop();
    PianoPlaybackService.stopAll();

    if (window.WorkspaceChordTimeline) WorkspaceChordTimeline.reset();
    if (window.WorkspaceHandController) WorkspaceHandController.reset();
    if (currentChordEngine) { currentChordEngine.clear(); currentChordEngine = null; }
    if (piano) { piano.voicing = null; piano.applyVoicingDOM(); }

    if (audioURL) { URL.revokeObjectURL(audioURL); audioURL = null; }
    DATA = null; currentFile = null;
    activeMode = 'simplified';

    document.getElementById('file-input').value = '';

    document.querySelectorAll('.mode-btn').forEach(btn => {
        const isSimp = (btn.dataset.mode === 'simplified' || btn.dataset.mode === 'simple');
        btn.classList.toggle('active', isSimp);
        btn.setAttribute('aria-selected', isSimp);
    });

    showScreen('upload-screen');
}

// ─── File handling ────────────────────────────────────────────────────────────
function handleFile(file) {
    resetApp();
    currentFile = file;
    audioURL = URL.createObjectURL(file);

    document.getElementById('prog-file-name').textContent = file.name;
    document.getElementById('prog-bar').style.width = '5%';
    document.getElementById('prog-msg').textContent = 'Uploading audio file...';
    document.getElementById('prog-bar-container')?.classList.remove('hidden');
    document.getElementById('prog-msg')?.classList.remove('hidden');
    document.getElementById('prog-error-box')?.classList.add('hidden');

    showScreen('analysis-screen');

    const fd = new FormData();
    fd.append('file', file);

    let consecutiveFailures = 0;
    const poll = () => {
        fetch('/progress')
            .then(r => r.json())
            .then(p => {
                consecutiveFailures = 0;
                if (p.pct !== undefined) document.getElementById('prog-bar').style.width = Math.max(5, p.pct) + '%';
                if (p.msg) document.getElementById('prog-msg').textContent = p.msg;
            })
            .catch(() => { if (++consecutiveFailures > 10) showAnalysisError('Connection to backend server lost.'); });

        fetch('/result')
            .then(r => r.json())
            .then(res => {
                if (!res) return;
                if (res.error) { showAnalysisError(res.error); return; }
                if (res.ready === true) {
                    if (analysisPollInterval) { clearInterval(analysisPollInterval); analysisPollInterval = null; }
                    DATA = res;
                    initResults(res);
                }
            })
            .catch(() => {});
    };

    if (analysisPollInterval) clearInterval(analysisPollInterval);
    analysisPollInterval = setInterval(poll, 800);

    fetch('/analyze', { method: 'POST', body: fd })
        .then(r => { if (!r.ok) return r.text().then(t => { throw new Error(`Server ${r.status}: ${t}`); }); return r.json(); })
        .catch(err => showAnalysisError(`Upload failed: ${err.message}`));
}

// ─── initResults — called once after successful analysis ──────────────────────
async function initResults(data) {
    if (data) DATA = data;
    try {
        if (!DATA) throw new Error('No analysis data provided');

        // Build canonical SongTimeline
        const timeline = {
            duration: DATA.duration || 0,
            metadata: {
                tempo: DATA.tempo || 120,
                key: DATA.key || 'C',
                key_full: DATA.key_full || 'C Major',
                easy_key_full: DATA.easy_key_full || DATA.key_full || 'C Major'
            },
            originalChords: (DATA.chords || []).map(c => ({
                startTime: c.time,
                endTime: c.end !== undefined ? c.end : c.time + 2.0,
                chordName: c.chord,
                notes: DATA.chord_data && DATA.chord_data[c.chord] ? DATA.chord_data[c.chord].notes : [0, 4, 7],
                confidence: c.confidence || 0.9
            })),
            beginnerChords: (DATA.beginner_chords || DATA.chords || []).map(c => ({
                startTime: c.time,
                endTime: c.end !== undefined ? c.end : c.time + 2.0,
                chordName: c.chord,
                notes: DATA.chord_data && DATA.chord_data[c.chord] ? DATA.chord_data[c.chord].notes : [0, 4, 7],
                confidence: c.confidence || 0.9
            }))
        };
        DATA.timeline = timeline;

        PlaybackClock.setDuration(DATA.duration || 0);
        UnifiedPianoPlaybackController.loadTimeline(timeline);
        UnifiedPianoPlaybackController.bindClock(PlaybackClock);

        currentChordEngine = new CurrentChordEngine(PlaybackClock);
        currentChordEngine.loadTimeline(timeline);
        currentChordEngine.setMode('beginner');

        // Mount WorkspaceChordTimeline
        if (window.WorkspaceChordTimeline) {
            WorkspaceChordTimeline.init({
                prevEl:    document.getElementById('chord-prev'),
                curEl:     document.getElementById('chord-current'),
                nextEl:    document.getElementById('chord-next'),
                trackEl:   document.getElementById('chord-track'),
                viewport:  document.getElementById('chord-viewport'),
                fillEl:    document.getElementById('chord-progress-fill'),
                onSeek:    t => PlaybackClock.seek(t)
            });
            WorkspaceChordTimeline.loadChords(timeline.beginnerChords);
        }

        // Inject hand SVGs once
        if (window.HandDiagrams) {
            const lhEl = document.getElementById('ws-lh-svg');
            const rhEl = document.getElementById('ws-rh-svg');
            if (lhEl && !lhEl.querySelector('svg')) lhEl.innerHTML = HandDiagrams.getHandMarkup('LH');
            if (rhEl && !rhEl.querySelector('svg')) rhEl.innerHTML = HandDiagrams.getHandMarkup('RH');
        }
        if (window.WorkspaceHandController) WorkspaceHandController.init();

        if (currentFile) SongAudioController.loadFile(currentFile).catch(err => console.warn('[Audio] Load:', err));
        else if (audioURL) SongAudioController.load(audioURL).catch(err => console.warn('[Audio] Load:', err));
        SongAudioController.bindClock(PlaybackClock);

        document.getElementById('dur-time').textContent = fmtTime(DATA.duration || 0);
        document.getElementById('seek-bar').max = DATA.duration || 0;

        _applyModeData('simplified');

        showScreen('workspace');
        document.getElementById('workspace').classList.remove('hidden');

        setTimeout(() => { try { renderWaveform(); } catch (e) { console.warn(e); } }, 300);

    } catch (err) {
        console.error('[HotChords] initResults failed:', err);
        showAnalysisError('Failed to display results: ' + err.message);
    }
}

// ─── Mode Switching: Simplified vs Original ──────────────────────────────────
function setMode(newMode) {
    const normalized = (newMode === 'simple' || newMode === 'simplified') ? 'simplified' : 'original';
    if (normalized === activeMode && DATA) return;
    activeMode = normalized;

    const ws = document.getElementById('workspace');
    if (ws) ws.dataset.mode = normalized;

    document.querySelectorAll('.mode-btn').forEach(btn => {
        const btnMode = btn.dataset.mode;
        const isActive = (btnMode === normalized) || (normalized === 'simplified' && btnMode === 'simple');
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-selected', isActive);
    });

    if (!DATA) return;
    _applyModeData(normalized);
}

function _applyModeData(mode) {
    if (!DATA || !DATA.timeline) return;
    const timeline = DATA.timeline;
    const isOrig = (mode === 'original');

    const chords = isOrig ? timeline.originalChords : timeline.beginnerChords;
    const pianoMode = isOrig
        ? (window.PianoPlaybackMode ? PianoPlaybackMode.ORIGINAL_CHORDS : 'ORIGINAL_CHORDS')
        : (window.PianoPlaybackMode ? PianoPlaybackMode.BEGINNER_CHORDS : 'BEGINNER_CHORDS');
    const keyDisplay = isOrig
        ? (DATA.key_full || 'C Major')
        : (DATA.easy_key_full || DATA.key_full || 'C Major');

    const keyEl = document.getElementById('val-key');
    if (keyEl) keyEl.textContent = keyDisplay;

    const bpmEl = document.getElementById('val-bpm');
    const sigEl = document.getElementById('val-sig');
    const trackEl = document.getElementById('res-file-name');
    if (bpmEl) bpmEl.textContent = Math.round(DATA.tempo || 120);
    if (sigEl) sigEl.textContent = DATA.time_sig || '4/4';
    if (trackEl) trackEl.textContent = DATA.file || 'Audio Track';

    // Update WorkspaceChordTimeline instantly
    if (window.WorkspaceChordTimeline) {
        WorkspaceChordTimeline.loadChords(chords);
    }

    // Sync CurrentChordEngine
    if (currentChordEngine) {
        currentChordEngine.setMode(isOrig ? 'original' : 'beginner');
    }

    // Switch piano playback mode
    try {
        UnifiedPianoPlaybackController.switchMode(pianoMode);
    } catch (e) {
        console.warn('[Mode] switchMode:', e);
    }

    // Immediately update hands & piano at current time
    _syncHandsAndPiano(PlaybackClock.currentTime);
}

function _syncHandsAndPiano(currentTime) {
    if (!currentChordEngine || !piano) return;
    const chordState = currentChordEngine.getState(currentTime);
    if (chordState && chordState.currentChord) {
        const voicing = PianoFingeringEngine.getChordVoicing(
            chordState.currentChord.chordName || chordState.currentChord.chord,
            chordState.currentChord.notes
        );
        piano.voicing = voicing;
        piano.applyVoicingDOM();

        if (window.WorkspaceHandController) {
            WorkspaceHandController.update(
                chordState.currentChord.chordName || chordState.currentChord.chord,
                chordState.currentChord.notes,
                voicing
            );
        }
    } else {
        if (piano.voicing !== null) {
            piano.voicing = null;
            piano.applyVoicingDOM();
        }
        if (window.WorkspaceHandController) {
            WorkspaceHandController.reset();
        }
    }
}

// ─── Playback controls ────────────────────────────────────────────────────────
function handleTogglePlay() {
    if (PlaybackClock.state === 'PLAYING') {
        PlaybackClock.pause();
    } else {
        PianoPlaybackService.resume();
        PlaybackClock.play();
    }
}

function handleStop()    { PlaybackClock.stop(); }
function handleRestart() { PianoPlaybackService.resume(); PlaybackClock.restart(); }
function handleSeek(val) { PlaybackClock.seek(parseFloat(val)); }

function handleToggleSustain() {
    if (window.PianoPlaybackService) updateSustainUI(window.PianoPlaybackService.toggleSustain());
}

function updateSustainUI(isSustain) {
    const btn = document.getElementById('btn-sustain');
    if (!btn) return;
    btn.textContent = isSustain ? 'Sustain ON' : 'Sustain OFF';
    btn.classList.toggle('btn-sustain-active', isSustain);
}

function handleWfClick(e) {
    if (DATA) handleSeek(e.offsetX / e.currentTarget.clientWidth * DATA.duration);
}

function setSpeed(rate) {
    PlaybackClock.setPlaybackRate(rate);
    document.querySelectorAll('.speed-btn').forEach(btn => btn.classList.remove('active'));
    if (rate === 1.0)  document.getElementById('spd-100')?.classList.add('active');
    if (rate === 0.75) document.getElementById('spd-075')?.classList.add('active');
    if (rate === 0.5)  document.getElementById('spd-050')?.classList.add('active');
}

// ─── Clock subscriber (rAF — runs every frame during playback) ────────────────
function updateClockUI(snap) {
    const seekBar = document.getElementById('seek-bar');
    const curTime = document.getElementById('cur-time');
    const playhead = document.getElementById('playhead');
    const playIcon = document.getElementById('play-icon');

    if (seekBar) seekBar.value = snap.currentTime;
    if (curTime) curTime.textContent = fmtTime(snap.currentTime);
    if (DATA && DATA.duration > 0 && playhead) {
        playhead.style.left = (snap.currentTime / DATA.duration * 100) + '%';
    }
    if (playIcon) {
        playIcon.innerHTML = snap.state === 'PLAYING'
            ? '<rect x="4" y="3" width="3" height="10" rx="1"/><rect x="9" y="3" width="3" height="10" rx="1"/>'
            : '<path d="M5 3l9 5-9 5V3z"/>';
    }

    // Chord timeline update
    if (window.WorkspaceChordTimeline) {
        WorkspaceChordTimeline.update(snap.currentTime);
    }

    // Hands and piano update
    _syncHandsAndPiano(snap.currentTime);
}

// ─── Waveform renderer ────────────────────────────────────────────────────────
function renderWaveform() {
    try {
        const canvas = document.getElementById('wf-canvas');
        if (!canvas || !canvas.parentElement || !audioURL) return;
        const W = canvas.parentElement.clientWidth, H = canvas.parentElement.clientHeight;
        if (W <= 0 || H <= 0) return;
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d');
        const blue = getComputedStyle(document.documentElement).getPropertyValue('--blue').trim() || '#0071E3';

        fetch(audioURL)
            .then(r => r.arrayBuffer())
            .then(buf => {
                const ac = new (window.AudioContext || window.webkitAudioContext)();
                ac.decodeAudioData(buf, decoded => {
                    try {
                        const data = decoded.getChannelData(0);
                        const step = Math.ceil(data.length / W);
                        const amp = H / 2;
                        ctx.beginPath();
                        ctx.strokeStyle = blue;
                        ctx.lineWidth = 1.5;
                        for (let i = 0; i < W; i++) {
                            let min = 1, max = -1;
                            for (let j = 0; j < step; j++) {
                                const v = data[(i * step) + j];
                                if (v < min) min = v;
                                if (v > max) max = v;
                            }
                            ctx.moveTo(i, amp + min * amp);
                            ctx.lineTo(i, amp + max * amp);
                        }
                        ctx.stroke();
                    } finally {
                        ac.close();
                    }
                }, err => console.warn('[Waveform] decodeAudioData:', err));
            })
            .catch(err => console.warn('[Waveform] fetch:', err));
    } catch (e) {
        console.warn('[Waveform] error:', e);
    }
}

// ─── Utility ──────────────────────────────────────────────────────────────────
function fmtTime(s) {
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return `${m}:${sec.toString().padStart(2, '0')}`;
}
</script>
