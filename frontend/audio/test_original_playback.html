<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotChords - Original Chord Piano Playback Demo & Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0D0F12;
            color: #F0F4F8;
            padding: 32px;
            max-width: 860px;
            margin: 0 auto;
        }
        h1 { font-size: 22px; margin-bottom: 6px; }
        p.sub { color: #8E9BAE; font-size: 14px; margin-top: 0; margin-bottom: 24px; }
        .panel {
            background: #171A21;
            border: 1px solid #2A303C;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        button {
            background: #4F8CFF;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }
        button:hover { opacity: 0.9; }
        button.danger { background: #E5484D; }
        button.secondary { background: #20242D; color: #F0F4F8; }
        .timeline-cards {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 8px;
        }
        .chord-card {
            background: #20242D;
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 12px 16px;
            min-width: 110px;
            text-align: center;
            transition: all 0.2s;
        }
        .chord-card.active {
            border-color: #4F8CFF;
            background: rgba(79, 140, 255, 0.15);
            transform: scale(1.04);
        }
        .chord-card .name { font-size: 20px; font-weight: 700; color: #F0F4F8; }
        .chord-card .time { font-size: 12px; color: #8E9BAE; margin-top: 4px; }
        .log-box {
            background: #20242D;
            border-radius: 8px;
            padding: 16px;
            font-family: monospace;
            font-size: 13px;
            color: #36D399;
            min-height: 160px;
            max-height: 240px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.6;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            background: #20242D;
            color: #FBBD23;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

    <h1>Original Chord Piano Playback Demo</h1>
    <p class="sub">Validating SongTimeline.original_chords playback through OriginalChordPlaybackController and Tone.js.</p>

    <div class="panel">
        <div id="playback-status" class="status-badge">Status: Stopped</div>

        <div class="timeline-cards" id="chord-display">
            <!-- Chord Cards rendered here -->
        </div>

        <div class="btn-row">
            <button onclick="playPopSample()">▶ Play Pop (C - G - Am - F)</button>
            <button onclick="playJazzSample()">▶ Play Jazz 7ths (Dm7 - G7 - Cmaj7 - A7)</button>
            <button class="danger" onclick="stopPlayback()">■ Stop</button>
            <button class="secondary" onclick="runAutomatedSuite()">✓ Run Automated Test Suite</button>
        </div>

        <div id="log-box" class="log-box">Ready. Click a Play button to test live piano playback.</div>
    </div>

    <!-- Tone.js, PianoPlaybackService, and OriginalChordPlaybackController -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="/js/audio/pianoPlaybackService.js"></script>
    <script src="/js/audio/originalChordPlaybackController.js"></script>

    <script>
        const logEl = document.getElementById('log-box');
        const statusEl = document.getElementById('playback-status');
        const chordDisplayEl = document.getElementById('chord-display');

        function log(msg) {
            logEl.innerHTML += `\n${msg}`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        // Test Timelines
        const POP_TIMELINE = {
            duration: 8.0,
            originalChords: [
                { startTime: 0.0, endTime: 2.0, chordName: 'C', notes: [0, 4, 7], confidence: 0.95 },
                { startTime: 2.0, endTime: 4.0, chordName: 'G', notes: [7, 11, 2], confidence: 0.92 },
                { startTime: 4.0, endTime: 6.0, chordName: 'Am', notes: [9, 0, 4], confidence: 0.90 },
                { startTime: 6.0, endTime: 8.0, chordName: 'F', notes: [5, 9, 0], confidence: 0.93 }
            ]
        };

        const JAZZ_TIMELINE = {
            duration: 8.0,
            originalChords: [
                { startTime: 0.0, endTime: 2.0, chordName: 'Dm7', notes: [2, 5, 9, 0], confidence: 0.91 },
                { startTime: 2.0, endTime: 4.0, chordName: 'G7', notes: [7, 11, 2, 5], confidence: 0.94 },
                { startTime: 4.0, endTime: 6.0, chordName: 'Cmaj7', notes: [0, 4, 7, 11], confidence: 0.96 },
                { startTime: 6.0, endTime: 8.0, chordName: 'A7', notes: [9, 1, 4, 7], confidence: 0.88 }
            ]
        };

        function renderChordCards(timeline) {
            chordDisplayEl.innerHTML = timeline.originalChords.map((c, i) => `
                <div class="chord-card" id="card-${i}">
                    <div class="name">${c.chordName}</div>
                    <div class="time">${c.startTime.toFixed(1)}s - ${c.endTime.toFixed(1)}s</div>
                </div>
            `).join('');
        }

        OriginalChordPlaybackController.onStateChange(state => {
            statusEl.textContent = `Status: ${state.toUpperCase()}`;
            statusEl.style.color = state === 'playing' ? '#36D399' : '#FBBD23';
            log(`[Playback State] ${state}`);
            if (state === 'stopped') {
                document.querySelectorAll('.chord-card').forEach(el => el.classList.remove('active'));
            }
        });

        OriginalChordPlaybackController.onChordTrigger((chordEvent, index) => {
            document.querySelectorAll('.chord-card').forEach(el => el.classList.remove('active'));
            const card = document.getElementById(`card-${index}`);
            if (card) card.classList.add('active');
            log(`[Chord Trigger] [${chordEvent.startTime.toFixed(2)}s] ${chordEvent.chordName} (Pitch classes: [${chordEvent.notes.join(', ')}])`);
        });

        function playPopSample() {
            renderChordCards(POP_TIMELINE);
            log('Starting Pop Progression: C -> G -> Am -> F...');
            OriginalChordPlaybackController.playOriginalChords(POP_TIMELINE, 0);
        }

        function playJazzSample() {
            renderChordCards(JAZZ_TIMELINE);
            log('Starting Jazz 7ths: Dm7 -> G7 -> Cmaj7 -> A7...');
            OriginalChordPlaybackController.playOriginalChords(JAZZ_TIMELINE, 0);
        }

        function stopPlayback() {
            log('Stopping playback...');
            OriginalChordPlaybackController.stopOriginalChords();
        }

        // Automated Unit & Integration Suite
        window.runAutomatedSuite = async function() {
            log('=== RUNNING AUTOMATED CONTROLLER VERIFICATION ===');
            try {
                // 1. Note conversion check
                const testEvent = { startTime: 0.0, endTime: 2.0, chordName: 'C', notes: [0, 4, 7] };
                const playable = OriginalChordPlaybackController.convertChordEventToPlayableNotes(testEvent);
                if (!playable.includes(48) || !playable.includes(60) || !playable.includes(64) || !playable.includes(67)) {
                    throw new Error('convertChordEventToPlayableNotes failed mapping notes');
                }
                log('✓ ChordEvent to Playable Notes conversion verified');

                // 2. Playback state
                await OriginalChordPlaybackController.playOriginalChords(POP_TIMELINE, 0);
                if (!OriginalChordPlaybackController.isPlaying()) throw new Error('isPlaying() is false after start');
                log('✓ Playback started with sample-accurate timeline schedule');

                // 3. Stop
                OriginalChordPlaybackController.stopOriginalChords();
                if (OriginalChordPlaybackController.isPlaying()) throw new Error('isPlaying() is true after stop');
                log('✓ Stop and immediate voice cancellation verified');

                // 4. Repeated start without voice duplication
                await OriginalChordPlaybackController.playOriginalChords(JAZZ_TIMELINE, 0);
                OriginalChordPlaybackController.stopOriginalChords();
                log('✓ Repeated start/restart safety verified');

                log('=== ALL PHASE 3C CONTROLLER TESTS PASSED! ===');
                return true;
            } catch (err) {
                log(`✗ Test Failed: ${err.message}`);
                return false;
            }
        };
    </script>
</body>
</html>
