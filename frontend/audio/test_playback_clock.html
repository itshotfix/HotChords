<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotChords - Central PlaybackClock Verification</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0D0F12;
            color: #F0F4F8;
            padding: 32px;
            max-width: 900px;
            margin: 0 auto;
        }
        h1 { font-size: 22px; margin-bottom: 6px; }
        p.sub { color: #8E9BAE; font-size: 14px; margin-top: 0; margin-bottom: 24px; }
        .panel {
            background: #171A21;
            border: 1px solid #2A303C;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .display-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            background: #20242D;
            padding: 16px 20px;
            border-radius: 8px;
            font-family: monospace;
            align-items: center;
        }
        .time-val { font-size: 28px; font-weight: bold; color: #36D399; }
        .meta-val { font-size: 14px; color: #8E9BAE; }
        .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        button {
            background: #4F8CFF;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }
        button:hover { opacity: 0.9; }
        button.rate-btn { background: #20242D; color: #F0F4F8; border: 1px solid #2A303C; }
        button.rate-btn.active { background: #36D399; color: #0D0F12; font-weight: bold; }
        button.danger { background: #E5484D; }
        button.secondary { background: #20242D; color: #F0F4F8; }
        .log-box {
            background: #20242D;
            border-radius: 8px;
            padding: 16px;
            font-family: monospace;
            font-size: 13px;
            color: #36D399;
            min-height: 200px;
            max-height: 320px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <h1>Central PlaybackClock Testbed</h1>
    <p class="sub">Validating monotonic high-resolution musical timeline traversal at 1.0x, 0.75x, and 0.5x rates without drift or position jumping.</p>

    <div class="panel">
        <div class="display-row">
            <div>
                <div style="font-size:11px;color:#8E9BAE;text-transform:uppercase;margin-bottom:4px;">Timeline Time</div>
                <div id="time-display" class="time-val">0.000s</div>
            </div>
            <div style="margin-left:auto;text-align:right;">
                <div class="meta-val" id="state-display">State: STOPPED</div>
                <div class="meta-val" id="rate-display">Rate: 1.00x</div>
                <div class="meta-val" id="dur-display">Duration: 10.0s</div>
            </div>
        </div>

        <div class="btn-row">
            <button onclick="PlaybackClock.play()">▶ Play</button>
            <button class="secondary" onclick="PlaybackClock.pause()">⏸ Pause</button>
            <button class="danger" onclick="PlaybackClock.stop()">■ Stop</button>
            <button class="secondary" onclick="PlaybackClock.seek(2.0)">Seek 2.0s</button>
            <button class="secondary" onclick="PlaybackClock.seek(5.0)">Seek 5.0s</button>
            <button class="rate-btn active" id="rate-1" onclick="setRate(1.0)">1.00x</button>
            <button class="rate-btn" id="rate-075" onclick="setRate(0.75)">0.75x</button>
            <button class="rate-btn" id="rate-05" onclick="setRate(0.5)">0.50x</button>
            <button class="secondary" onclick="runAutomatedClockTests()">✓ Run 16-Point Test Suite</button>
        </div>

        <div id="log-box" class="log-box">Ready. Click 'Run 16-Point Test Suite' or test controls above.</div>
    </div>

    <!-- Load PlaybackClock -->
    <script src="/js/audio/playbackClock.js"></script>

    <script>
        const logEl = document.getElementById('log-box');
        const timeEl = document.getElementById('time-display');
        const stateEl = document.getElementById('state-display');
        const rateEl = document.getElementById('rate-display');
        const durEl = document.getElementById('dur-display');

        function log(msg) {
            logEl.innerHTML += `\n${msg}`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        // Initialize clock with 10.0s test duration
        PlaybackClock.setDuration(10.0);

        PlaybackClock.subscribe(snap => {
            timeEl.textContent = `${snap.currentTime.toFixed(3)}s`;
            stateEl.textContent = `State: ${snap.state}`;
            rateEl.textContent = `Rate: ${snap.playbackRate.toFixed(2)}x`;
            durEl.textContent = `Duration: ${snap.duration.toFixed(1)}s`;
        });

        function setRate(r) {
            PlaybackClock.setPlaybackRate(r);
            document.querySelectorAll('.rate-btn').forEach(b => b.classList.remove('active'));
            if (r === 1.0) document.getElementById('rate-1').classList.add('active');
            if (r === 0.75) document.getElementById('rate-075').classList.add('active');
            if (r === 0.5) document.getElementById('rate-05').classList.add('active');
            log(`[Rate Change] -> ${r}x`);
        }

        // 16-Point Automated Clock Suite using mock time provider
        window.runAutomatedClockTests = async function() {
            log('=== RUNNING 16-POINT PLAYBACK CLOCK TEST SUITE ===');
            try {
                let mockTimeMs = 1000.0;
                const clock = new PlaybackClockClass({
                    duration: 10.0,
                    timeProvider: () => mockTimeMs
                });

                // 1. Initial state
                if (clock.state !== PlaybackState.STOPPED || clock.getCurrentTime() !== 0 || clock.playbackRate !== 1.0) {
                    throw new Error('1. Initial state check failed');
                }
                log('✓ 1. Initial state verified (STOPPED, 0.0s, 1.0x)');

                // 2. play()
                clock.play();
                if (clock.state !== PlaybackState.PLAYING) throw new Error('2. play() state failed');
                log('✓ 2. play() state transition verified');

                // 3. pause()
                mockTimeMs += 2000.0; // 2 wall-clock seconds at 1.0x -> 2.0s timeline
                clock.pause();
                if (clock.state !== PlaybackState.PAUSED || Math.abs(clock.getCurrentTime() - 2.0) > 1e-4) {
                    throw new Error('3. pause() position failed');
                }
                log('✓ 3. pause() position stability verified');

                // 4. stop()
                clock.stop();
                if (clock.state !== PlaybackState.STOPPED || clock.getCurrentTime() !== 0) {
                    throw new Error('4. stop() failed');
                }
                log('✓ 4. stop() state & zero reset verified');

                // 5. seek()
                clock.seek(4.5);
                if (Math.abs(clock.getCurrentTime() - 4.5) > 1e-4) throw new Error('5. seek() failed');
                log('✓ 5. seek(4.5) verified');

                // 6. playback rate 1.0
                clock.stop();
                clock.setPlaybackRate(1.0);
                clock.play();
                mockTimeMs += 1000.0;
                if (Math.abs(clock.getCurrentTime() - 1.0) > 1e-4) throw new Error('6. 1.0x progression failed');
                log('✓ 6. Playback rate 1.00x progression verified');

                // 7. playback rate 0.75
                clock.stop();
                clock.setPlaybackRate(0.75);
                clock.play();
                mockTimeMs += 1000.0; // 1s wall clock * 0.75 = 0.75s timeline
                if (Math.abs(clock.getCurrentTime() - 0.75) > 1e-4) throw new Error('7. 0.75x progression failed');
                log('✓ 7. Playback rate 0.75x progression verified');

                // 8. playback rate 0.5
                clock.stop();
                clock.setPlaybackRate(0.5);
                clock.play();
                mockTimeMs += 2000.0; // 2s wall clock * 0.5 = 1.0s timeline
                if (Math.abs(clock.getCurrentTime() - 1.0) > 1e-4) throw new Error('8. 0.50x progression failed');
                log('✓ 8. Playback rate 0.50x progression verified');

                // 9. changing rate while playing (continuity check)
                // Currently at 1.0s timeline. Switch to 1.0x, advance 1s -> should be 2.0s
                clock.setPlaybackRate(1.0);
                if (Math.abs(clock.getCurrentTime() - 1.0) > 1e-4) throw new Error('9. Position jumped on rate change');
                mockTimeMs += 1000.0;
                if (Math.abs(clock.getCurrentTime() - 2.0) > 1e-4) throw new Error('9. Post-rate change progression failed');
                log('✓ 9. Changing rate while playing preserves exact timeline continuity');

                // 10. pause/resume
                clock.pause();
                const posBefore = clock.getCurrentTime();
                mockTimeMs += 5000.0; // Wall time advances while paused
                if (Math.abs(clock.getCurrentTime() - posBefore) > 1e-4) throw new Error('10. Paused time drifted');
                clock.play();
                mockTimeMs += 1000.0; // Advance 1s while playing
                if (Math.abs(clock.getCurrentTime() - (posBefore + 1.0)) > 1e-4) throw new Error('10. Resume progression failed');
                log('✓ 10. Pause/Resume zero-drift verified');

                // 11. seek while playing
                clock.seek(6.0);
                mockTimeMs += 1000.0;
                if (Math.abs(clock.getCurrentTime() - 7.0) > 1e-4) throw new Error('11. Seek while playing failed');
                log('✓ 11. Seek while playing verified');

                // 12. duration boundary clamping and auto-stop
                clock.seek(9.5);
                mockTimeMs += 1000.0; // Would advance to 10.5s -> should clamp to 10.0s and stop
                if (clock.getCurrentTime() !== 10.0 || clock.state !== PlaybackState.STOPPED) {
                    throw new Error('12. Duration boundary auto-stop failed');
                }
                log('✓ 12. Duration boundary clamping and auto-stop verified');

                // 13. invalid playback rate rejection
                const invRes1 = clock.setPlaybackRate(0);
                const invRes2 = clock.setPlaybackRate(-1.5);
                const invRes3 = clock.setPlaybackRate(NaN);
                if (invRes1 !== false || invRes2 !== false || invRes3 !== false || clock.playbackRate !== 1.0) {
                    throw new Error('13. Invalid rate rejection failed');
                }
                log('✓ 13. Invalid/zero/negative rate rejection verified');

                // 14. subscriber notifications
                let receivedSnap = null;
                const unsub = clock.subscribe(snap => { receivedSnap = snap; });
                clock.seek(3.0);
                if (!receivedSnap || receivedSnap.currentTime !== 3.0) throw new Error('14. Subscriber notification failed');
                unsub();
                log('✓ 14. Subscriber notification & snapshot delivery verified');

                // 15. no timeline drift caused by repeated play/pause
                clock.seek(0);
                clock.play();
                for (let i = 0; i < 50; i++) {
                    mockTimeMs += 10.0;
                    clock.pause();
                    mockTimeMs += 50.0;
                    clock.play();
                }
                // 50 * 10ms playing time = 500ms = 0.500s
                if (Math.abs(clock.getCurrentTime() - 0.500) > 1e-4) {
                    throw new Error(`15. Drift detected after 50 play/pause cycles: got ${clock.getCurrentTime()}s, expected 0.500s`);
                }
                log('✓ 15. Zero drift verified across 50 rapid play/pause cycles');

                // 16. stop resets position
                clock.stop();
                if (clock.getCurrentTime() !== 0 || clock.state !== PlaybackState.STOPPED) {
                    throw new Error('16. Stop reset failed');
                }
                log('✓ 16. Stop resets position to 0.0s verified');

                log('=== ALL 16 PLAYBACK CLOCK TESTS PASSED SUCCESSFULLY! ===');
                return true;
            } catch (err) {
                log(`✗ Test Failed: ${err.message}`);
                return false;
            }
        };
    </script>
</body>
</html>
