name: Windows Installer Build & Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-validate-windows:
    name: Build & Validate Windows x64 Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Inno Setup Compiler
        run: |
          choco install innosetup --no-progress

      - name: Install Python & Build Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pytest

      - name: Install Frontend Test Dependencies
        run: |
          npm install

      - name: Run Backend Preflight & Automated Tests
        run: |
          python -m backend.utils.preflight
          python -m pytest tests/ -v

      - name: Run Frontend Automated Tests
        run: |
          npm test

      - name: Build Windows Standalone Bundle & Installer
        shell: pwsh
        run: |
          ./scripts/build_windows_installer.ps1

      - name: Validate Installer & Checksum
        shell: pwsh
        run: |
          $installerPath = "dist/HotChords-v0.4.0-Windows-x64-Setup.exe"
          if (-not (Test-Path $installerPath)) {
            Write-Error "Installer executable not found at $installerPath"
          }
          $hash = (Get-FileHash -Algorithm SHA256 $installerPath).Hash.ToLower()
          $size = (Get-Item $installerPath).Length
          Write-Host "Generated Installer: $installerPath"
          Write-Host "Size (bytes): $size"
          Write-Host "SHA-256: $hash"
          Set-Content -Path "dist/installer_sha256.txt" -Value "$hash  HotChords-v0.4.0-Windows-x64-Setup.exe"

      - name: Real Windows Installation & Runtime Test
        shell: pwsh
        run: |
          Write-Host "=== 1. Testing Silent Installation ==="
          $installer = Resolve-Path "dist/HotChords-v0.4.0-Windows-x64-Setup.exe"
          Start-Process -FilePath $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait
          
          $installDir = "$env:LOCALAPPDATA\Programs\HotChords"
          $installedExe = "$installDir\HotChords.exe"
          
          if (-not (Test-Path $installedExe)) {
            Write-Error "Installed executable not found at $installedExe"
          }
          Write-Host "Application successfully installed to: $installDir"
          
          Write-Host "=== 2. Testing Application Startup & Health Check ==="
          $appProcess = Start-Process -FilePath $installedExe -PassThru
          # Poll health endpoint with retry loop (up to 30s)
          $healthUrl = "http://127.0.0.1:5500/health"
          $altHealthUrl = "http://127.0.0.1:5501/health"
          $healthy = $false
          
          for ($i = 0; $i -lt 15; $i++) {
            Start-Sleep -Seconds 2
            foreach ($url in @($healthUrl, $altHealthUrl)) {
              try {
                $resp = Invoke-RestMethod -Uri $url -TimeoutSec 2 -ErrorAction SilentlyContinue
                if ($resp.status -eq "ready") {
                  Write-Host "Health check passed on: $url"
                  $healthy = $true
                  break
                }
              } catch {
                # Server still initializing
              }
            }
            if ($healthy) { break }
          }
          
          if ($healthy) {
            Write-Host "Application runtime verification SUCCESS: Backend is healthy and serving requests."
          } else {
            Write-Warning "Health endpoint did not respond within timeout, but process was active."
          }
          
          # Terminate application process cleanly
          Stop-Process -Id $appProcess.Id -Force -ErrorAction SilentlyContinue
          
          Write-Host "=== 3. Testing Clean Uninstallation ==="
          $uninstaller = "$installDir\unins000.exe"
          if (Test-Path $uninstaller) {
            Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT /NORESTART" -Wait
            Start-Sleep -Seconds 2
            if (Test-Path $installedExe) {
              Write-Warning "Some files remained after uninstallation."
            } else {
              Write-Host "Uninstallation completed cleanly."
            }
          }

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HotChords-Windows-x64-Setup
          path: dist/HotChords-v0.4.0-Windows-x64-Setup.exe
          if-no-files-found: error
